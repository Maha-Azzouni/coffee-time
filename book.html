<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="icon" type="image/png" href="assets/images/icon.png">
    <title>Coffee Time</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <img src="assets/images/logo.png" width="60px" alt="image"/>
            <span class="coffee-text">Coffee Time</span>
        </div>
        <div class="header-links">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="order.html">Orders</a>
            <a href="about.html">About</a>
            <a href="book.html">Book</a>
            <button id="signInBtn" class="btn">Sign In</button>
            <button id="logoutBtn" class="btn" hidden>Log Out</button>
        </div>
    </div>

    <!-- Body -->
    <div id="book">
        <div class="heading">
            <span class="text-prim">What Happen Here</span>
            <h2>RESERVATION AREA</h2>
        </div>
        <div class="row">
            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3918.7056412534234!2d106.6377536!3d10.8338237!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3175295a96d3134d%3A0xe1d1bb4fcc202543!2sCoffee%20Time!5e0!3m2!1sen!2s!4v1769599162042!5m2!1sen!2s"
                    width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <div class="book-content">
                <h3>Book a Table</h3>
                <form>
                    <input type="text" name="name" id="name" placeholder="Your Name">
                    <input type="email" name="email" id="email" placeholder="Your Email">
                    <input type="number" name="persons" id="persons" placeholder="Persons">
                    <input type="date" name="date" id="date">
                    <input type="time" name="time" id="time">
                    <textarea name="message" id="message" placeholder="Your Message" rows="6"></textarea>
                    <button type="submit" class="btn btn-submit">BOOK A TABLE</button>
                </form>
            </div>
        </div>
    </div>

    <!-- footer -->
    <footer id="footer">
        <div class="col">
            <h3>Coffee</h3>
            <span><i class="fa-solid fa-location-dot"></i> Address: Vietnam</span>
            <span><i class="fa-solid fa-envelope"></i> Email: coffee@mahaazzouni.com</span>
            <span><i class="fa-solid fa-phone"></i> Phone: 0123456789</span>
        </div>
        <div class="col">
            <h3>Service</h3>
            <span><a href="index.html">Shop</a></span>
            <span><a href="book.html">Book ahead</a></span>
            <span><a href="menu.html">Menu</a></span>
        </div>
        <div class="col">
            <h3>About us</h3>
            <span><a href="about.html">About us</a></span>
            <span><a href="our-story.html">Our story</a></span>
        </div>
        <div>
            <h3>Social Media</h3>
            <div class="social-media">
                <i class="fa-brands fa-twitter"></i>
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-linkedin-in"></i>
            </div>
        </div>
    </footer>

    <script src="assets/js/script.js"></script>
</body>

</html>
